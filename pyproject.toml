[project]
name = "gridrl"
version = "0.1.0"
description = "GridWorld environment with partially observable color observations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu126 = ["torch>=2.5"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=8",
]

# код лежит в папке src/ и импортируется как `from src.envs import make_env` из корня репозитория;
# проект не устанавливается как пакет, uv ставит только зависимости
[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
